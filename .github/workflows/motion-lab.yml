name: Build UI Motion Lab APK
on:
  push:
    branches: [main, native-pdf-annotator]
    paths:
      - "motion-lab/**"
      - ".github/workflows/motion-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: motion-lab
        run: gradle :app:assembleDebug
      - name: Verify APK
        run: |
          test -s motion-lab/app/build/outputs/apk/debug/app-debug.apk
          ls -lh motion-lab/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UI-Motion-Lab-APK
          path: motion-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
