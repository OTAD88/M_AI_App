name: Build Risala Android APK

on:
  push:
    branches:
      - risala-android
    paths:
      - "risala/**"
      - ".github/workflows/risala-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build installable release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build release APK
        run: gradle --no-daemon -p risala :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: risala-release-apk
          path: risala/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
