<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M_AI_App</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff66;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        #loader {
            margin-top: 15px;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>root@M_AI_App:~# System Initialized</h2>
        <p>جاري تحميل محرك الذكاء الاصطناعي والهندسة العكسية ...</p>
        <div id="loader">[ ساري التحميل... ]</div>
    </div>

    <script>
        // مصفوفة حركة بسيطة لضمان أن الشاشة تتحرك وليست جامدة
        const spinner = ['/', '-', '\\', '|'];
        let i = 0;
        const loaderEl = document.getElementById('loader');
        
        const interval = setInterval(() => {
            loaderEl.innerText = `[ ${spinner[i = (i + 1) % spinner.length]} ] جاري تفعيل المحرك المحلي...`;
        }, 150);

        // الانتقال التلقائي والسريع للواجهة الرئيسية بعد 2.5 ثانية
        setTimeout(() => {
            clearInterval(interval);
            // يمكنك توجيه التطبيق هنا لواجهتك الرئيسية أو تحميل ملف الـ JS الأساسي
            loaderEl.innerText = "[ تم الإقلاع بنجاح! ]";
        }, 2500);
    </script>
</body>
</html>
