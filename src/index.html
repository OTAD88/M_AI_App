<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M_AI_App</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff66;
            font-family: monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #splash-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            transition: opacity 0.5s ease;
        }
        #app-container {
            display: none;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        h2 { color: #00ff66; }
        .terminal-box {
            border: 1px dashed #00ff66;
            padding: 15px;
            margin-top: 20px;
            background: #050505;
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل المؤقتة -->
    <div id="splash-screen">
        <h2>root@M_AI_App:~# System Initialized</h2>
        <p>جاري تحميل محرك الذكاء الاصطناعي والهندسة العكسية ...</p>
        <div id="loader">[ / ] جاري تفعيل النواة المحلية...</div>
    </div>

    <!-- واجهة التطبيق الفعلية التي ستظهر بعد الإقلاع -->
    <div id="app-container">
        <h2>M_AI_App - الواجهة الرئيسية</h2>
        <div class="terminal-box">
            <p>✅ تم إقلاع المحرك والتحكم بنجاح!</p>
            <p>🤖 مرحباً بك يا مليون، نظام الذكاء الاصطناعي والشطرنج جاهز للعمل.</p>
            <div id="features-output"></div>
        </div>
    </div>

    <!-- ربط السكريبت الأساسي للمشروع -->
    <script type="module" src="./index.js"></script>

    <script>
        // حركة مؤشر التحميل
        const spinner = ['/', '-', '\\', '|'];
        let i = 0;
        const loaderEl = document.getElementById('loader');
        
        const interval = setInterval(() => {
            loaderEl.innerText = `[ ${spinner[i = (i + 1) % spinner.length]} ] جاري فحص الملفات المحلية...`;
        }, 150);

        // الانتقال التلقائي للواجهة الرئيسية بعد ثانيتين
        setTimeout(() => {
            clearInterval(interval);
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
            }, 500);
        }, 2000);
    </script>
</body>
</html>
