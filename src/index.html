<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M_AI_App - الواجهة الرئيسية</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ff66;
            font-family: monospace;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            border-bottom: 2px solid #00ff66;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0;
        }
        #app-root {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card {
            background: #111827;
            border: 1px solid #00ff66;
            padding: 12px;
            border-radius: 6px;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 5px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>root@M_AI_App:~# Main Interface</h1>
    </header>

    <div id="app-root">
        <div class="card">
            <p><strong>حالة النظام:</strong> متصل ويعمل محلياً بنجاح ✅</p>
            <p><strong>المطور:</strong> مليون</p>
        </div>
        
        <div class="card">
            <p>أوامر التشغيل السريع:</p>
            <button onclick="alert('تم تفعيل محرك الذكاء الاصطناعي بنجاح!')">تشغيل محرك الذكاء الاصطناعي</button>
            <button onclick="alert('جارٍ فتح رقعة الشطرنج والتحليل...')">فتح وضع الشطرنج</button>
        </div>
    </div>

</body>
</html>
