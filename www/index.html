<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي M-AI</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --accent-color: #3b82f6;
            --msg-ai: #1e293b;
            --msg-user: #2563eb;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body.light-theme {
            --bg-main: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-main: #0f172a;
            --accent-color: #2563eb;
            --msg-ai: #e2e8f0;
            --msg-user: #3b82f6;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .header h3 { margin: 0; font-size: 1.1rem; }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .btn-icon:hover { background: var(--border-color); }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-start;
            background: var(--msg-user);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-end;
            background: var(--msg-ai);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .tts-btn {
            display: inline-flex;
            align-items: center;
            margin-top: 8px;
            background: transparent;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .tts-btn:hover { opacity: 1; }

        /* Input Controls */
        .input-bar {
            padding: 12px 16px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-bar input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.05);
            color: var(--text-main);
            outline: none;
        }

        .send-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .stop-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-card);
            color: var(--text-main);
            padding: 24px;
            border-radius: 16px;
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
        }

        .modal.active { display: block; }

        .color-picker-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        .color-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-icon" onclick="openSettings()">⚙️</button>
        <h3>المساعد الذكي M-AI</h3>
        <button class="btn-icon" onclick="clearChat()">🗑️</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            مرحباً بك يا مليون. أنا جاهز تماماً لتنفيذ أوامرك.
            <br>
            <button class="tts-btn" onclick="speakText(this.parentElement.innerText)">🔊 استماع</button>
        </div>
    </div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)" />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
        <button class="stop-btn" id="stopBtn" onclick="stopGenerating()">🛑 إيقاف</button>
    </div>

    <!-- Theme & Color Settings Modal -->
    <div class="modal" id="settingsModal">
        <h4>إعدادات المظهر والألوان</h4>
        
        <label><input type="radio" name="theme" value="dark" checked onclick="setTheme('dark')"> الوضع الداكن (Dark)</label><br><br>
        <label><input type="radio" name="theme" value="light" onclick="setTheme('light')"> الوضع الفاتح (Light)</label><br><br>
        <label><input type="radio" name="theme" value="custom" onclick="setTheme('custom')"> تخصيص ألوان كامل</label>

        <div class="color-picker-box" id="customControls">
            <div class="color-controls">
                <span>لون التطبيق الأساسي (الدائرة):</span>
                <input type="color" id="primaryColor" value="#3b82f6" onchange="updateCustomColors()">
            </div>
            <div class="color-controls">
                <span>درجة الخفوت/السطوع (المربع):</span>
                <input type="range" id="bgBrightness" min="5" max="95" value="15" oninput="updateCustomColors()">
            </div>
        </div>

        <br>
        <button class="send-btn" style="width: 100%;" onclick="closeSettings()">حفظ وإغلاق</button>
    </div>

    <script>
        let isGenerating = false;
        let responseTimeout = null;

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text || isGenerating) return;

            const container = document.getElementById('chatContainer');
            
            // User Message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = text;
            container.appendChild(userMsg);

            input.value = '';
            toggleButtons(true);

            // AI Response (Simulated / Connected to Server)
            responseTimeout = setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.innerHTML = `تم استلام أمرك: "${text}".<br><button class="tts-btn" onclick="speakText(this.parentElement.innerText)">🔊 استماع</button>`;
                container.appendChild(aiMsg);
                container.scrollTop = container.scrollHeight;
                toggleButtons(false);
            }, 1200);

            container.scrollTop = container.scrollHeight;
        }

        function stopGenerating() {
            if (responseTimeout) {
                clearTimeout(responseTimeout);
                responseTimeout = null;
            }
            window.speechSynthesis.cancel(); // إيقاف الصوت إن كان يعمل
            toggleButtons(false);

            const container = document.getElementById('chatContainer');
            const stoppedNotice = document.createElement('div');
            stoppedNotice.className = 'message ai';
            stoppedNotice.style.opacity = '0.7';
            stoppedNotice.innerText = '⚠️ تم إيقاف الإجابة بواسطة المستخدم.';
            container.appendChild(stoppedNotice);
            container.scrollTop = container.scrollHeight;
        }

        function toggleButtons(generating) {
            isGenerating = generating;
            document.getElementById('sendBtn').style.display = generating ? 'none' : 'inline-block';
            document.getElementById('stopBtn').style.display = generating ? 'inline-block' : 'none';
        }

        function speakText(text) {
            window.speechSynthesis.cancel();
            const cleanText = text.replace('🔊 استماع', '').trim();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ar-SA';
            window.speechSynthesis.speak(utterance);
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }

        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }
        function clearChat() { document.getElementById('chatContainer').innerHTML = ''; }

        function setTheme(theme) {
            document.body.classList.remove('light-theme');
            if(theme === 'light') {
                document.body.classList.add('light-theme');
            } else if(theme === 'custom') {
                updateCustomColors();
            }
        }

        function updateCustomColors() {
            const color = document.getElementById('primaryColor').value;
            const brightness = document.getElementById('bgBrightness').value;
            
            document.body.style.setProperty('--accent-color', color);
            document.body.style.setProperty('--msg-user', color);
            document.body.style.setProperty('--bg-main', `hsl(220, 20%, ${brightness}%)`);
            document.body.style.setProperty('--bg-card', `hsl(220, 20%, ${parseInt(brightness) + 10}%)`);
            document.body.style.setProperty('--text-main', brightness > 50 ? '#000' : '#fff');
        }
    </script>
</body>
</html>
